<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Keep Clone</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo-cluster">
      <button class="icon-btn tooltip-wrapper" aria-label="Main Menu">
        <span class="material-symbols-outlined">menu</span>
        <span class="tooltip-text">Main Menu</span>
      </button>
      <img class="keep-logo" src="https://www.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png" srcset="https://www.gstatic.com/images/branding/product/2x/keep_2020q4_48dp.png 2x" alt="Google Keep Logo" />
      <span class="logo-text">Keep</span>
    </div>

    <div class="search-bar-container">
      <div class="tooltip-wrapper" style="width: 100%;">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="search" placeholder="Search" aria-label="Search notes" />
        <span class="tooltip-text">Search</span>
      </div>
    </div>

    <div class="actions-cluster">
      <button class="icon-btn tooltip-wrapper" aria-label="Refresh">
        <span class="material-symbols-outlined">refresh</span>
        <span class="tooltip-text">Refresh</span>
      </button>
      <button class="icon-btn tooltip-wrapper" aria-label="Toggle View List">
        <span class="material-symbols-outlined">view_agenda</span>
        <span class="tooltip-text">View List</span>
      </button>
      <button class="icon-btn tooltip-wrapper" aria-label="Settings">
        <span class="material-symbols-outlined">settings</span>
        <span class="tooltip-text">Settings</span>
      </button>
    </div>

    <div class="profile-cluster">
      <button class="icon-btn tooltip-wrapper" aria-label="Google Apps">
        <span class="material-symbols-outlined">apps</span>
        <span class="tooltip-text">Apps</span>
      </button>
      <button class="icon-btn tooltip-wrapper" aria-label="Google Account">
        <span class="material-symbols-outlined">account_circle</span>
        <span class="tooltip-text">Accounts</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Layout -->
  <main class="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" aria-label="Main Navigation">
      <button class="sidebar-menu-item active" aria-current="page">
        <span class="material-symbols-outlined">lightbulb</span>
        <span class="sidebar-text">Notes</span>
      </button>
      <button class="sidebar-menu-item">
        <span class="material-symbols-outlined">notifications</span>
        <span class="sidebar-text">Reminders</span>
      </button>
      <button class="sidebar-menu-item">
        <span class="material-symbols-outlined">edit</span>
        <span class="sidebar-text">Edit Labels</span>
      </button>
      <button class="sidebar-menu-item">
        <span class="material-symbols-outlined">archive</span>
        <span class="sidebar-text">Archive</span>
      </button>
      <button class="sidebar-menu-item">
        <span class="material-symbols-outlined">delete</span>
        <span class="sidebar-text">Trash</span>
      </button>
    </aside>

    <!-- Workspace Area -->
    <section class="workspace">
      <!-- Collapsed / Inactive Note Form -->
      <div class="note-composer inactive-composer">
        <form>
          <input type="text" class="input-note-body" placeholder="Take a note..." />
          <div class="quick-actions">
            <button type="button" class="icon-btn tooltip-wrapper" aria-label="New List"><span class="material-symbols-outlined">check_box</span><span class="tooltip-text">New List</span></button>
            <button type="button" class="icon-btn tooltip-wrapper" aria-label="New Drawing"><span class="material-symbols-outlined">brush</span><span class="tooltip-text">New Drawing</span></button>
            <button type="button" class="icon-btn tooltip-wrapper" aria-label="New Image Note"><span class="material-symbols-outlined">image</span><span class="tooltip-text">New Image</span></button>
          </div>
        </form>
      </div>

      <!-- Expanded / Active Note Form -->
      <div class="note-composer active-composer">
        <form id="form" class="expanded-form">
          <input id="note-title" type="text" class="input-note-title" placeholder="Title" />
          <input id="note-text" type="text" class="input-note-body" placeholder="Take a note..." />
          
          <div class="form-footer">
            <div class="toolbar-icons">
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Remind me"><span class="material-symbols-outlined">add_alert</span><span class="tooltip-text">Remind me</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Add collaborator"><span class="material-symbols-outlined">person_add</span><span class="tooltip-text">Collaborator</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Change color"><span class="material-symbols-outlined">palette</span><span class="tooltip-text">Change Color</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Add image"><span class="material-symbols-outlined">image</span><span class="tooltip-text">Add Image</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Archive note"><span class="material-symbols-outlined">archive</span><span class="tooltip-text">Archive</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="More options"><span class="material-symbols-outlined">more_vert</span><span class="tooltip-text">More</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Undo"><span class="material-symbols-outlined">undo</span><span class="tooltip-text">Undo</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Redo"><span class="material-symbols-outlined">redo</span><span class="tooltip-text">Redo</span></button>
            </div>
            <button type="button" class="text-close-btn">Close</button>
          </div>
        </form>
      </div>

      <!-- Notes Grid Container -->
      <div class="notes-display-grid"></div>
    </section>

    <!-- Detailed Note Edit Modal -->
    <dialog class="note-modal" id="note-details-modal">
      <div class="modal-body">
        <form id="modal-form" class="expanded-form">
          <input id="modal-title" type="text" class="input-note-title" placeholder="Title" />
          <input id="modal-text" type="text" class="input-note-body" placeholder="Take a note..." />
          
          <div class="form-footer">
            <div class="toolbar-icons">
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Remind me"><span class="material-symbols-outlined">add_alert</span><span class="tooltip-text">Remind me</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Add collaborator"><span class="material-symbols-outlined">person_add</span><span class="tooltip-text">Collaborator</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Change color"><span class="material-symbols-outlined">palette</span><span class="tooltip-text">Change Color</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Add image"><span class="material-symbols-outlined">image</span><span class="tooltip-text">Add Image</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Archive note"><span class="material-symbols-outlined">archive</span><span class="tooltip-text">Archive</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="More options"><span class="material-symbols-outlined">more_vert</span><span class="tooltip-text">More</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Undo"><span class="material-symbols-outlined">undo</span><span class="tooltip-text">Undo</span></button>
              <button type="button" class="icon-btn small tooltip-wrapper" aria-label="Redo"><span class="material-symbols-outlined">redo</span><span class="tooltip-text">Redo</span></button>
            </div>
            <button type="button" id="modal-btn" class="text-close-btn">Close</button>
          </div>
        </form>
      </div>
    </dialog>
  </main>

  <!-- External Script Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cuid/1.3.8/browser-cuid.min.js" integrity="sha512-AvtLzKgbVcTZJ0QZ3nLJoTGN2wiE/emjebM9xneyqhtEBRTsNB+8oeQGkOmyOF+gnJd7k3Zvnghs9m6EuTpTEw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>
